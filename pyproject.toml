[tool.poetry]
name = "project1_zhukov_timofey_m25-555"
version = "0.1.0"
description = "Homework 1 Python"
authors = ["Жуков Тимофей <dmerz22848@gmail.com>"]
packages = [
    { include = "labyrinth_game", from = "." }
]

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.scripts]
project = "labyrinth_game.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff (>=0.14.1,<0.15.0)"
]
